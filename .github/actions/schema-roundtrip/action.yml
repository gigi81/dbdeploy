name: Schema round trip
description: >-
  Scripts the database a deploy has just left behind, replays that script into an empty database,
  and scripts that one too. What the two scripts say has to be identical.

inputs:
  example:
    description: >-
      Folder under examples/ that was deployed. The same name under .github/roundtrip/ holds the
      settings of the databases the script is replayed into.
    required: true
  project:
    description: The dbdeploy project to run.
    required: true

runs:
  using: composite
  steps:
    # generate-schema refuses to overwrite an _Init.sql that already exists, so the scripts are
    # generated into scratch roots rather than into the example. Only the settings are taken from
    # the example, which is what makes this script exactly what the deploy above produced.
    - name: Script the deployed database
      shell: bash
      env:
        EXAMPLE: ${{ inputs.example }}
        PROJECT: ${{ inputs.project }}
      run: |
        set -euo pipefail
        mkdir -p roundtrip/from
        cp "examples/$EXAMPLE"/dbsettings*.json roundtrip/from/
        dotnet run --configuration Release --project "$PROJECT" -- generate-schema --path roundtrip/from

    # The first half of the contract: the generated script is deployable top to bottom on an empty
    # database. A missing dependency, a name only resolvable on the source server, an object written
    # before the one it needs - all of it fails here.
    - name: Replay the script into an empty database
      shell: bash
      env:
        EXAMPLE: ${{ inputs.example }}
        PROJECT: ${{ inputs.project }}
      run: |
        set -euo pipefail
        mkdir -p roundtrip/to
        cp -r roundtrip/from/. roundtrip/to/
        rm -f roundtrip/to/dbsettings*.json
        cp ".github/roundtrip/$EXAMPLE/dbsettings.json" roundtrip/to/
        dotnet run --configuration Release --project "$PROJECT" -- deploy --path roundtrip/to -b main --create

    - name: Script the replayed database
      shell: bash
      env:
        EXAMPLE: ${{ inputs.example }}
        PROJECT: ${{ inputs.project }}
      run: |
        set -euo pipefail
        mkdir -p roundtrip/back
        cp ".github/roundtrip/$EXAMPLE/dbsettings.json" roundtrip/back/
        dotnet run --configuration Release --project "$PROJECT" -- generate-schema --path roundtrip/back

    # The second half: scripting the replayed database says the same thing as scripting the original
    # one. Anything the generation drops on the floor is missing from the replayed database and shows
    # up here as a difference. This is a fixed point rather than a checked in expected file: it needs
    # no maintenance when a server image moves, because both sides are read from the same server.
    - name: Compare the two scripts
      shell: bash
      env:
        LC_ALL: C
      run: |
        set -euo pipefail

        # Two lines legitimately differ: the generation timestamp, and the header naming the source,
        # which is a different database or schema on either side. Everything else, including the
        # object count, has to match.
        #
        # The lines are sorted and their trailing comma dropped, so what is compared is what the two
        # scripts say and not the order they say it in. That the order is right is what the replay
        # above proves, and the order of what a server hands back is not always ours to control:
        # DBMS_METADATA writes the inline constraints of a table in the order they were created, so
        # a table whose constraints are recreated by this very script comes back with the same
        # definitions in a different order - and with the separating comma on a different line.
        normalize() {
          sed -E \
            -e '/^(--|REM) Generated by dbdeploy on /d' \
            -e 's/^(--|REM) (Database|Schema) .+ - ([0-9]+) object/\1 \2 <source> - \3 object/' \
            -e 's/,[[:space:]]*$//' \
            "$1" | sort
        }

        diff -u roundtrip/from/main.csv roundtrip/back/main.csv

        status=0
        for script in roundtrip/from/*/_Init.sql; do
          database="$(basename "$(dirname "$script")")"
          replayed="roundtrip/back/$database/_Init.sql"

          if [ ! -f "$replayed" ]; then
            echo "::error::$database: the replayed database produced no script"
            status=1
            continue
          fi

          normalize "$script" > "roundtrip/$database.from.sql"
          normalize "$replayed" > "roundtrip/$database.back.sql"

          if diff -u "roundtrip/$database.from.sql" "roundtrip/$database.back.sql" > "roundtrip/$database.diff"; then
            echo "$database: the round trip is a fixed point ($(wc -l < "$script") lines)"
          else
            echo "::error::$database: scripting the replayed database says something else than scripting the original"
            head -n 200 "roundtrip/$database.diff"
            status=1
          fi
        done

        exit $status

    - name: Upload the generated scripts
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: schema-roundtrip-${{ inputs.example }}
        path: roundtrip
