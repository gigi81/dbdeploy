name: Continuous Integration
on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # TUnit runs on Microsoft.Testing.Platform (see global.json): the xUnit trait filter is now a
      # tree node filter on the test category, and the reports come from the platform rather than
      # from VSTest loggers and collectors.
      #
      # One invocation per leg, rather than a unit and an integration pass. A filter that matches
      # nothing in a project still writes that project's TRX, and a TRX with no test in it is one
      # dorny/test-reporter cannot read ("td.UnitTest is not iterable").
      - name: Run Tests
        run: >
          dotnet test --results-directory ./TestResults
          --treenode-filter "/*/*/*/*[Category!=Docker]"
          --report-trx --report-trx-filename "{asm}-test-results.trx"
          --coverage --coverage-output-format cobertura
          || true
        if: runner.os != 'Linux'
      # Only Linux has a Docker engine, so it is the leg that also runs the Testcontainers tests.
      - name: Run Tests and Integration Tests
        run: >
          dotnet test --results-directory ./TestResults
          --report-trx --report-trx-filename "{asm}-test-results.trx"
          --coverage --coverage-output-format cobertura
          || true
        if: runner.os == 'Linux'
      - name: Test Report
        uses: dorny/test-reporter@v1.9.1
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: "./TestResults/*-results.trx"
          reporter: dotnet-trx
          fail-on-error: true
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: Code coverage ${{ matrix.os }}
          path: "./TestResults/*.cobertura.xml"
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        if: runner.os == 'Linux'
        with:
          files: "./TestResults/*.cobertura.xml"
          token: ${{ secrets.CODECOV_TOKEN }}
  pack:
    name: Pack
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Create packages
        run: dotnet pack --configuration Release --output ./packages
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuGet packages
          path: packages/*.*
  deploy:
    name: Deploy
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: NuGet packages
          path: packages
      # Nerdbank.GitVersioning takes the version from version.json, not from the tag, so the two have
      # to agree: bump version.json in a PR first, then tag the merge commit. Without this check a
      # mismatched tag would silently publish whatever version.json happened to say.
      - name: Verify the tag matches version.json
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(jq -r .version version.json)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.json ($actual). Bump version.json to $expected on main and re-tag."
            exit 1
          fi
          ls -1 "packages/dbdeploy.$expected.nupkg"
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push packages
        run: dotnet nuget push "packages/*.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generateReleaseNotes: true
      - name: Comment relevant issues and merge requests
        uses: apexskier/github-release-commenter@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          comment-template: |
            This is addressed in release {release_link}.
          label-template: |
            state: released