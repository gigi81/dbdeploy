name: Integration Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

# A push to a branch with an open PR fires both `push` and `pull_request` for the same commit;
# cancelling a superseded run here means a quick follow-up push doesn't leave two runs racing.
concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_ENVIRONMENT: ci
  PROJECT: src/Grillisoft.Tools.DatabaseDeploy.Cli/Grillisoft.Tools.DatabaseDeploy.Cli.csproj
  # A fixed path, rather than whatever $HOME resolves to inside the SDK container, so the cache
  # step below and dotnet's own restore agree on where packages land.
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  mssql-job:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          SA_PASSWORD: 'SqlServer2019!'
        ports:
          - 1433:1433
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # These jobs only ever build and run the CLI project, so there's no reason to restore every
      # test project's dependencies along with it.
      - name: Dotnet restore
        run: dotnet restore "$PROJECT"

      - name: Dotnet build
        run: dotnet build "$PROJECT" --configuration Release --no-restore

      - name: dbdeploy ci
        run: dotnet run --configuration Release --no-build --project $PROJECT -- ci --path examples/mssql-02 -c --branch release/1.1

      - name: dbdeploy generate-schema round trip
        uses: ./.github/actions/schema-roundtrip
        with:
          example: mssql-02
          project: ${{ env.PROJECT }}


  oracle-job:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    services:
      oracle:
        image: gvenzl/oracle-free:latest
        env:
          ORACLE_PASSWORD: 'oracle2019!'
        ports:
          - 1521:1521
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Dotnet restore
        run: dotnet restore "$PROJECT"

      - name: Dotnet build
        run: dotnet build "$PROJECT" --configuration Release --no-restore

      - name: dbdeploy ci
        run: dotnet run --configuration Release --no-build --project $PROJECT -- ci --path examples/oracle-01 -c --branch release/1.1

      - name: dbdeploy generate-schema round trip
        uses: ./.github/actions/schema-roundtrip
        with:
          example: oracle-01
          project: ${{ env.PROJECT }}

  mariadb-job:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    services:
      mariadb:
        image: mariadb:latest
        env:
          MARIADB_ROOT_PASSWORD: mariadb2019!
        ports:
          - 3306:3306
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Dotnet restore
        run: dotnet restore "$PROJECT"

      - name: Dotnet build
        run: dotnet build "$PROJECT" --configuration Release --no-restore

      - name: dbdeploy ci
        run: dotnet run --configuration Release --no-build --project $PROJECT -- ci --path examples/mysql-01 -c --branch release/1.1

      - name: dbdeploy generate-schema round trip
        uses: ./.github/actions/schema-roundtrip
        with:
          example: mysql-01
          project: ${{ env.PROJECT }}

  postgres-job:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_PASSWORD: postgres2019!
        ports:
          - 5432:5432
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Dotnet restore
        run: dotnet restore "$PROJECT"

      - name: Dotnet build
        run: dotnet build "$PROJECT" --configuration Release --no-restore

      - name: dbdeploy ci
        run: dotnet run --configuration Release --no-build --project $PROJECT -- ci --path examples/postgres-01 -c --branch release/1.1

      - name: dbdeploy generate-schema round trip
        uses: ./.github/actions/schema-roundtrip
        with:
          example: postgres-01
          project: ${{ env.PROJECT }}
